<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서비스 소개 - 냉·난방 AS</title>

  <link rel="stylesheet" th:href="@{/FirstPage.css}">
</head>
<body>

  <div class="container">

    <!-- 상단 메뉴 (메인페이지와 동일) -->
    <header class="first-top">
      <h1><a th:href="@{/}"><img th:src="@{/common/logo.jpg}" alt="냉·난방 AS 로고" class="brand-logo"></a></h1>

      <nav>
        <ul>
          <li><a th:href="@{/service-intro}">서비스소개</a></li>
          <li><a th:href="@{/features}">주요기능</a></li>
          <li>
            <a th:href="@{/member/login}"
               th:text="${session.loginMember == null} ? '로그인' : (${session.loginMember.memName} + '님')">로그인</a>
          </li>
          <li th:if="${session.loginMember != null}"><a th:href="@{/member/logout}">로그아웃</a></li>
        </ul>
      </nav>
    </header>

    <!-- 서비스 소개 내용 -->
    <section class="page-content">

      <div class="page-hero">
        <div class="page-icon">❄️</div>
        <h2>서비스 소개</h2>
        <p class="page-subtitle">
          냉·난방 AS기사 스케줄 관리 시스템은 고객의 수리 요청부터<br>
          기사 배정, 작업 완료 확인까지 전체 과정을 한 곳에서 관리할 수 있는 서비스입니다.
        </p>
      </div>

      <!-- 접수부터 완료까지 흐름을 4단계로 정리 -->
      <div class="flow-row">
        <div class="flow-step">
          <div class="flow-icon">📝</div>
          <div class="flow-label">사용자 신청</div>
          <div class="flow-desc">원하는 날짜와 시간에<br>수리를 신청합니다</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="flow-icon">🗂️</div>
          <div class="flow-label">관리자 배정</div>
          <div class="flow-desc">상황에 맞는<br>기사를 배정합니다</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="flow-icon">🔧</div>
          <div class="flow-label">기사 방문</div>
          <div class="flow-desc">배정받은 일정을 확인하고<br>방문하여 수리합니다</div>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-step">
          <div class="flow-icon">✅</div>
          <div class="flow-label">완료 확인</div>
          <div class="flow-desc">작업 결과를 등록하면<br>고객이 확인합니다</div>
        </div>
      </div>

      <a th:href="@{/}" class="btn btn-outline">홈으로 돌아가기</a>
    </section>

  </div>

</body>
</html>
