<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주요 기능 - 냉·난방 AS</title>

  <link rel="stylesheet" th:href="@{/FirstPage.css}">
</head>
<body>

  <div class="container">

    <!-- 상단 메뉴 (메인페이지와 동일) -->
    <header class="first-top">
      <h1><a th:href="@{/}">냉,난방 AS</a></h1>

      <nav>
        <ul>
          <li><a th:href="@{/service-intro}">서비스소개</a></li>
          <li><a th:href="@{/features}">주요기능</a></li>
          <li>
            <a th:href="@{/member/login}"
               th:text="${session.loginMember == null} ? '로그인' : (${session.loginMember.memName} + '님')">로그인</a>
          </li>
          <li th:if="${session.loginMember != null}"><a th:href="@{/member/logout}">로그아웃</a></li>
        </ul>
      </nav>
    </header>

    <!-- 주요 기능 내용 (카드 3개, 아직 실제 기능 페이지로 연결되지는 않음) -->
    <section class="page-content">

      <div class="page-hero">
        <div class="page-icon">🛠️</div>
        <h2>주요 기능</h2>
        <p class="page-subtitle">
          냉·난방 AS기사 스케줄 관리 시스템이 제공하는 핵심 기능입니다.
        </p>
      </div>

      <div class="feature-cards">
        <div class="feature-card accent-blue">
          <div class="feature-icon">📅</div>
          <h3>일정 관리</h3>
          <p>등록된 수리 요청을 한눈에 확인하고,<br>희망 일정에 맞춰 관리합니다.</p>
        </div>

        <div class="feature-card accent-green">
          <div class="feature-icon">👷</div>
          <h3>기사 관리</h3>
          <p>기사 정보와 담당 일정을 확인하고,<br>업무를 배정합니다.</p>
        </div>

        <div class="feature-card accent-orange">
          <div class="feature-icon">📝</div>
          <h3>AS 결과 보고</h3>
          <p>작업이 끝나면 결과와 메모를 남기고,<br>고객이 완료 여부를 확인할 수 있습니다.</p>
        </div>
      </div>

      <a th:href="@{/}" class="btn btn-outline">홈으로 돌아가기</a>
    </section>

  </div>

</body>
</html>
