<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주요 기능 - 냉·난방 AS</title>

  <link rel="stylesheet" th:href="@{/css/FirstPage.css}">
</head>
<body>

  <div class="container">

    <!-- 상단 메뉴 (메인페이지와 동일) -->
    <header class="first-top">
      <h1><a th:href="@{/}">냉,난방 AS</a></h1>

      <nav>
        <ul>
          <li><a th:href="@{/service-intro}">서비스소개</a></li>
          <li><a th:href="@{/features}">주요기능</a></li>
          <li><a th:href="@{/member/login}">로그인</a></li>
        </ul>
      </nav>
    </header>

    <!-- 주요 기능 내용 (카드 3개, 아직 실제 기능 페이지로 연결되지는 않음) -->
    <section class="page-content">
      <h2>주요 기능</h2>

      <div class="feature-cards">
        <div class="feature-card">
          <h3>일정 관리</h3>
          <p>등록된 수리 요청을 한눈에 확인하고,<br>희망 일정에 맞춰 관리합니다.</p>
        </div>

        <div class="feature-card">
          <h3>기사 관리</h3>
          <p>기사 정보와 담당 일정을 확인하고,<br>업무를 배정합니다.</p>
        </div>

        <div class="feature-card">
          <h3>AS 결과 보고</h3>
          <p>작업이 끝나면 결과와 메모를 남기고,<br>고객이 완료 여부를 확인할 수 있습니다.</p>
        </div>
      </div>

      <a th:href="@{/}" class="btn btn-outline">홈으로 돌아가기</a>
    </section>

  </div>

</body>
</html>
