<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냉·난방 AS | 스케줄 관제</title>
  <link rel="stylesheet" href="/common/main.css">
  <link rel="stylesheet" href="/common/side.css">
  <link rel="stylesheet" href="/common/header.css">

  <th:block layout:fragment="content_css"></th:block>
  <link rel="stylesheet" th:href="@{/common/layout.css}">

</head>

<body class="app-shell">

  <div class="container">

    <div class="side">
      <th:block th:replace="~{common/side::sideFragment}"></th:block>
    </div>


    <div class="main">
      <div class="header">
        <th:block th:replace="~{common/header::headerFragment}"></th:block>
      </div>

      <main class="content" id="main-content">
        <th:block layout:fragment="content"></th:block>
      </main>
    </div>

  </div>


  <script th:src="@{/common/forms.js}"></script>
  <script>
    // Highlight the current section, including detail pages and engineer redirects.
    const path = window.location.pathname;
    document.querySelectorAll('.side li a').forEach(function (link) {
      const href = new URL(link.href).pathname;
      const selected = path === href
        || (href === '/pages/admin/calendar' && path === '/as-schedule')
        || (href === '/pages/admin/management' && path === '/admin/engineer')
        || (href === '/request/list' && path.startsWith('/request/detail/'))
        || (href === '/pages/engineer/main' && path.startsWith('/as-result'));
      if (selected) link.setAttribute('aria-current', 'page');
    });
  </script>
  <th:block layout:fragment="content_js"></th:block>
</body>

</html>
