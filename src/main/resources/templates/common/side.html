<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

  <nav th:fragment="sideFragment">

    <div class="side-logo">
      <a th:href="@{/}"><img th:src="@{/common/logo.jpg}" alt="냉·난방 AS 로고" class="logo-img"></a>
    </div>

   
   
   
    <!-- 일반 사용자(user) 메뉴 -->
    <ul th:if="${session.loginMember?.role == 'user'}">
      <li><a th:href="@{/pages/user/main}">🏠 홈</a></li>
      <li><a th:href="@{/request/write}">🛠 A/S 신청</a></li>
      <!-- / 고객센터 페이지는 아직 안 만들어서 자리만 잡아둠 -->
      <a th:href="@{/request/list}">📋 신청 내역 조회</a>
      <li><a href="#">☎ 고객센터</a></li>
    </ul>


    <!-- 관리자(admin) 메뉴 : 화면은 아직 안 만들어서 전부 자리표시자 -->
    <ul th:if="${session.loginMember.role == 'admin'}">
      <li><a th:href="@{/pages/admin/main}">🏠 대시보드</a></li>
      <li><a href="#">📋 일정관리</a></li>
      <li><a th:href="@{/pages/admin/management}">👷 기사관리</a></li>
    </ul>

    <!-- 기사(repairman) 메뉴 : 화면은 아직 안 만들어서 전부 자리표시자 -->
    <ul th:if="${session.loginMember.role == 'repairman'}">
      <li><a th:href="@{/pages/engineer/main}">🏠 기사 홈</a></li>
    </ul>


  </nav>

</body>

</html>
