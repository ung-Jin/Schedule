<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접수 완료 - 냉·난방 AS</title>

  <link rel="stylesheet" th:href="@{/css/request.css}">
</head>
<body>

  <header class="top-bar">
    <div class="logo"><a th:href="@{/}">❄ 냉·난방 AS</a></div>

    <nav>
      <ul>
        <li><a th:href="@{/request/write}">A/S 신청</a></li>
        <li><a href="#">신청 내역 조회</a></li>
        <li><a href="#">고객센터</a></li>
      </ul>
    </nav>

    <div class="user-area">
      <span th:text="${session.loginMember.memName} + '님'">회원님</span>
      <a th:href="@{/member/logout}" class="logout">로그아웃</a>
    </div>
  </header>

  <div class="complete-wrap">
    <div class="complete-box">
      <h2>접수가 완료되었습니다</h2>
      <p>담당자 확인 후 기사 배정이 완료되면 연락을 드립니다.</p>

      <div class="form-buttons complete-buttons">
        <a th:href="@{/}" class="btn btn-outline">홈으로</a>
        <a th:href="@{/request/write}" class="btn btn-primary">추가 신청하기</a>
      </div>
    </div>
  </div>

</body>
</html>
