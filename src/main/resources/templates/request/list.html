<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<th:block layout:fragment="content_css">
    <link rel="stylesheet" href="/css/pages/request/request-list.css">
</th:block>

<th:block layout:fragment="content">

  <h2 class="list-title">내 신청 내역</h2>

  <!-- 신청한 내역이 하나도 없을 때 -->
  <div class="empty-box" th:if="${#lists.isEmpty(requestList)}">
    <p>신청한 내역이 없습니다.</p>
    <a th:href="@{/request/write}" class="btn btn-primary">A/S 신청하러 가기</a>
  </div>

  <!-- 신청한 내역이 있을 때 -->
  <p class="list-summary" th:unless="${#lists.isEmpty(requestList)}"
     th:text="'총 ' + ${#lists.size(requestList)} + '건의 신청 내역이 있습니다.'">총 1건의 신청 내역이 있습니다.</p>

  <div class="request-list" th:unless="${#lists.isEmpty(requestList)}">

    <!-- 카드(행) 전체가 링크입니다. 상세보기 버튼뿐 아니라 어디를 눌러도 상세 화면으로 이동합니다. -->
    <a class="request-row" th:each="req : ${requestList}"
       th:href="@{/request/detail/{no}(no=${req.requestNo})}"
       th:classappend="${req.status == 'RECEIVED'} ? 'row-received' : (${req.status == 'ASSIGNED'} ? 'row-assigned' : (${req.status == 'IN_PROGRESS'} ? 'row-progress' : (${req.status == 'COMPLETED'} ? 'row-completed' : 'row-canceled')))">

      <div class="request-info">
        <span class="request-no" th:text="'접수번호 ' + ${req.requestNo}">접수번호 1</span>
        <span class="request-product" th:text="${req.productType}">에어컨</span>
        <span class="request-symptom" th:text="${req.symptom}">증상 내용</span>
        <span class="request-date" th:text="'희망일 ' + ${#strings.substring(req.wishDate, 0, 10)}">희망일 2026-09-15</span>
      </div>

      <div class="request-row-side">
        <!-- 상태값(status)에 따라 배지 하나만 보이도록 각각 th:if로 나눴습니다. -->
        <span class="status-badge status-received"  th:if="${req.status == 'RECEIVED'}">접수완료</span>
        <span class="status-badge status-assigned"  th:if="${req.status == 'ASSIGNED'}">기사배정 완료</span>
        <span class="status-badge status-progress"  th:if="${req.status == 'IN_PROGRESS'}">수리 진행중</span>
        <span class="status-badge status-completed" th:if="${req.status == 'COMPLETED'}">수리 완료</span>
        <span class="status-badge status-canceled"  th:if="${req.status == 'CANCELED'}">취소됨</span>

        <span class="request-row-arrow" aria-hidden="true">→</span>
      </div>

    </a>

  </div>

</th:block>

<th:block layout:fragment="content_js"></th:block>

</html>
