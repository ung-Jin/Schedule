<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}">

<th:block layout:fragment="content_css">
  <!-- Home styles are supplied by common/main.css. -->
</th:block>

<th:block layout:fragment="content">

  <div class="welcome-card">
    <div class="welcome-icon" aria-hidden="true"><svg class="ui-icon"><use href="/common/ui-icons.svg#snow"/></svg></div>
    <div class="welcome-text">
      <span class="eyebrow">SERVICE DESK</span>
      <h2 th:text="${session.loginMember.memName} + '님, 안녕하세요'">회원님, 안녕하세요</h2>
      <p>냉·난방 AS기사 스케줄 관리 시스템입니다. 제품에 문제가 생기면 바로 A/S를 신청해보세요.</p>
      <a th:href="@{/request/write}" class="btn btn-primary">A/S 요청하기 →</a>
      <a th:href="@{/request/list}" class="btn btn-outline">신청 내역 확인</a>
    </div>
  </div>

  <h3 class="section-heading">서비스 진행 안내</h3>
  <div class="guide-cards">
    <div class="guide-card accent-blue">
      <div class="guide-icon" aria-hidden="true"><svg class="ui-icon"><use href="/common/ui-icons.svg#clipboard"/></svg></div>
      <span class="step-num">STEP 01</span>
      <h4>서비스 요청</h4>
      <p>A/S 요청 정보를 입력해주세요.</p>
    </div>
    <div class="guide-card accent-coral">
      <div class="guide-icon" aria-hidden="true"><svg class="ui-icon"><use href="/common/ui-icons.svg#assign"/></svg></div>
      <span class="step-num">STEP 02</span>
      <h4>접수 확인</h4>
      <p>접수 후 관리자 확인이 진행됩니다.</p>
    </div>
    <div class="guide-card accent-assigned">
      <div class="guide-icon" aria-hidden="true"><svg class="ui-icon"><use href="/common/ui-icons.svg#users"/></svg></div>
      <span class="step-num">STEP 03</span>
      <h4>기사 배정</h4>
      <p>담당 기사 배정이 완료되면 연락을 드립니다.</p>
    </div>
    <div class="guide-card accent-orange">
      <div class="guide-icon" aria-hidden="true"><svg class="ui-icon"><use href="/common/ui-icons.svg#wrench"/></svg></div>
      <span class="step-num">STEP 04</span>
      <h4>방문 서비스</h4>
      <p>배정된 기사님이 방문하여 점검 및 수리를 진행합니다.</p>
    </div>
  </div>

</th:block>

<th:block layout:fragment="content_js"></th:block>

</html>
