<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/result/result_dashboard.css">
</th:block>

<!--아래 block에 html코드 작성-->
<th:block layout:fragment="content">
  <div class="dash-container">

    <div class="dash-title">
      <h2>AS 기사 대시보드</h2>
      <p>오늘 배정된 AS 일정을 확인하고 처리 결과를 등록해주세요.</p>
    </div>

    <!-- 왼쪽 : 오늘의 일정 / 오른쪽 : 이번 달 달력. 좁은 화면에서는 세로로 쌓입니다(result_dashboard.css) -->
    <div class="dash-main">

      <!--
        todayList는 ResultController의 asResultDashboard()가 넘겨주는
        List<ScheduleTodayDTO> 입니다. th:each로 한 건씩 돌면서 카드 하나씩 그려줍니다.
        비어있으면 아래 today-empty 안내문구가 대신 보입니다.

        카드 상태는 버튼을 눌러서 바꾸는 대신, "배정된 방문 시작 시각(schedule.startTime)"이
        지금(now, 컨트롤러가 넘겨준 서버 기준 현재 시각)보다 지났는지로 자동 계산합니다.
        (종료 시각이 아니라 시작 시각 기준입니다 - 방문을 시작했으면 결과보고를 쓸 수 있는 상태로 봅니다)
        - 완료(COMPLETED)                         : "완료" - 카드 클릭 시 결과보고 "조회" 화면(읽기전용)으로 이동
        - 완료 아님 + 아직 방문 시작 전(now < startTime) : "진행예정" - 카드 클릭 시 달력에서 일정을 클릭한 것과
          똑같이 "고객 기본정보" 모달을 띄웁니다 (결과보고 화면으로는 이동하지 않음)
        - 완료 아님 + 방문 시작 시각 지남(now >= startTime) : "결과보고" - 카드 클릭 시 결과보고 "작성" 화면으로 이동

        이동할 주소는 data-report-url 속성에 담아두고(진행예정 카드는 비워둠), 아래 content_js의 스크립트에서
        클릭 이벤트로 읽어서 이동시킵니다. data-report-url이 비어있는(=진행예정) 카드는 대신
        data-customer-*/data-time-range/data-start-time 등을 읽어서 result_dashboard.js의
        openCustomerModal()을 그대로 재사용해 모달을 띄웁니다. (Thymeleaf는 onclick 같은 이벤트 속성 안에
        문자열을 직접 넣는 걸 막아둬서, data-* 속성 + JS 조합으로 처리합니다)
      -->
      <div class="dash-today-col">
        <div class="today-list" th:if="${not #lists.isEmpty(todayList)}">
          <div class="today-card"
               th:each="schedule : ${todayList}"
               th:classappend="${schedule.requestStatus != 'COMPLETED' and schedule.startTime.isAfter(now)} ? ' today-card-pending' : ''"
               th:data-report-url="${schedule.requestStatus == 'COMPLETED'}
                                    ? @{/as-result-view(scheduleNo=${schedule.scheduleNo})}
                                    : (${schedule.startTime.isAfter(now)}
                                       ? ''
                                       : @{/as-result-report(scheduleNo=${schedule.scheduleNo})})"
               th:data-schedule-no="${schedule.scheduleNo}"
               th:data-customer-name="${schedule.customerName}"
               th:data-customer-tel="${schedule.customerTel}"
               th:data-customer-addr="${schedule.customerAddr}"
               th:data-time-range="${#temporals.format(schedule.startTime, 'HH:mm')} + '~' + ${#temporals.format(schedule.endTime, 'HH:mm')}"
               th:data-start-time="${schedule.startTime}"
               th:data-status="${schedule.requestStatus}">
            <!-- 왼쪽 : 시간 -->
            <div class="today-time">
              <span th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">09:00</span>
              <span> ~ </span>
              <span th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">12:00</span>
            </div>

            <!-- 가운데 : 고객명 / 증상 -->
            <div class="today-middle">
              <div class="today-customer" th:text="${schedule.customerName}">고객명</div>
              <div class="today-symptom" th:text="${schedule.symptom}">증상</div>
            </div>

            <!-- 오른쪽 : 상태 표시 (위 주석 참고 - 완료/진행예정/결과보고 3단계, 전부 텍스트 표시만 하고
                 실제 이동은 카드 전체 클릭(data-report-url)이 담당합니다) -->
            <span th:if="${schedule.requestStatus == 'COMPLETED'}" class="status-badge status-done">
              완료
            </span>

            <span th:if="${schedule.requestStatus != 'COMPLETED' and schedule.startTime.isAfter(now)}" class="status-badge status-pending">
              진행예정
            </span>

            <span th:if="${schedule.requestStatus != 'COMPLETED' and !schedule.startTime.isAfter(now)}" class="status-badge status-report">
              결과보고
            </span>
          </div>
        </div>

        <div class="today-empty" th:if="${#lists.isEmpty(todayList)}">
          오늘 배정된 일정이 없습니다.
        </div>

        <!--
          고객 만족도 카드. ResultController의 asResultDashboard()가 SatisfactionService.getStats()로
          만들어서 넘겨주는 satisfactionStats(SatisfactionStatsDTO)를 그대로 그립니다.
          - satisfaction-compare : 이번 달 평균 vs 작년 같은 달 평균 + 증감
          - satisfaction-trend   : 올해 1월~이번 달까지 월별 평균을 막대그래프로 (막대 높이는 5점 만점 기준 서버에서 계산)
        -->
        <div class="dash-satisfaction-card">
          <h3 th:text="${memName} + '기사님 고객만족도 현황'">OOO기사님 고객만족도 현황</h3>

          <div class="satisfaction-compare">
            <div class="satisfaction-stat">
              <span class="satisfaction-stat-label" th:text="${satisfactionStats.thisMonth} + '월 (이번 달)'">이번 달</span>
              <span class="satisfaction-stat-value"
                    th:text="${satisfactionStats.thisMonthAvg != null ? satisfactionStats.thisMonthAvg : '-'}">4.5</span>
            </div>

            <div class="satisfaction-diff"
                 th:if="${satisfactionStats.diff != null}"
                 th:classappend="${satisfactionStats.diff >= 0} ? 'diff-up' : 'diff-down'"
                 th:text="${(satisfactionStats.diff >= 0 ? '▲ +' : '▼ ') + satisfactionStats.diff}">
              ▲ +0.5
            </div>

            <div class="satisfaction-stat">
              <span class="satisfaction-stat-label" th:text="'작년 ' + ${satisfactionStats.thisMonth} + '월'">작년 동월</span>
              <span class="satisfaction-stat-value"
                    th:text="${satisfactionStats.lastYearAvg != null ? satisfactionStats.lastYearAvg : '-'}">4.1</span>
            </div>
          </div>

          <div class="satisfaction-trend">
            <div class="trend-bar-wrap" th:each="m : ${satisfactionStats.monthlyTrend}">
              <span class="trend-bar-score" th:text="${m.avgScore > 0 ? m.avgScore : ''}">4.5</span>
              <!--
                고정 픽셀이 아니라 그래프 영역의 실제 높이(100%) 기준 비율로 계산합니다.
                34px는 위 점수(trend-bar-score)/아래 월 라벨(trend-bar-label) + gap이 차지하는 고정 공간이라,
                그 나머지 공간을 막대가 avgScore/5 비율만큼 채우게 됩니다. (그래프 자체가 카드 높이에 맞춰
                커지거나 작아지면 막대도 그만큼 같이 늘어나고 줄어듭니다 - .satisfaction-trend가 flex:1인 것과 세트)
              -->
              <div class="trend-bar" th:style="'height:calc((100% - 34px) * ' + (${m.avgScore} / 5) + ')'"></div>
              <span class="trend-bar-label" th:text="${m.month} + '월'">1월</span>
            </div>
          </div>
        </div>
      </div>

      <!--
        이번 달 일정 달력. 날짜 칸을 직접 서버에서 그리는 대신 FullCalendar(관리자 일정 페이지와 동일한 CDN 버전)를
        그대로 붙여서 씁니다. 달력에 표시할 데이터는 여기서 미리 내려주지 않고, result_dashboard.js가
        /as-result-calendar?year=&month= 를 호출해서 지금 보여주는 달의 일정(고객명/시간/주소/연락처)을 그때그때 받아옵니다.
        (달을 넘겨도 그 달의 데이터가 항상 맞게 나오도록 하기 위함)
        일정이 찍힌 칸의 짧은 정보 블록을 클릭하면 result_dashboard.js의 eventClick에서 결과보고 화면으로
        이동하는 대신 아래 "고객 기본정보" 모달을 띄워줍니다. (결과보고 작성/조회는 왼쪽 "오늘의 일정"
        카드에서 하고, 달력은 빠르게 고객 정보 확인 + 전화연결만 하는 용도로 분리했습니다)
      -->
      <div class="dash-calendar-card">
        <h3>이번 달 일정</h3>
        <div id="dashCalendar"></div>
        <div class="dash-calendar-legend">
          <span><i class="dash-legend-dot dash-legend-past"></i>지난 일정</span>
          <span><i class="dash-legend-dot dash-legend-today"></i>오늘 일정</span>
          <span><i class="dash-legend-dot dash-legend-future"></i>예정된 일정</span>
        </div>
      </div>

    </div>

    <!--
      달력에서 일정을 클릭하면 뜨는 "고객 기본정보" 모달. 기본은 숨김(hidden) 상태이고,
      result_dashboard.js의 openCustomerModal()이 클릭한 일정의 정보(고객명/연락처/주소/방문시간)를
      채워 넣고 hidden을 풀어서 보여줍니다. 연락처 옆 "전화연결" 버튼은 tel: 링크로 바로 통화 연결됩니다.
    -->
    <div id="customerInfoModal" class="modal-overlay" hidden>
      <div class="modal-box">
        <button type="button" id="customerModalClose" class="modal-close" aria-label="닫기">×</button>
        <h3>고객 기본정보</h3>
        <div class="info-table">
          <div class="info-row">
            <span class="info-title">고객명</span>
            <span class="info-value" id="modalCustomerName">-</span>
          </div>
          <div class="info-row">
            <span class="info-title">연락처</span>
            <span class="info-value modal-tel-row">
              <span id="modalCustomerTel">-</span>
              <a id="modalCallBtn" class="call-btn" href="#">전화연결</a>
            </span>
          </div>
          <div class="info-row">
            <span class="info-title">주소</span>
            <span class="info-value" id="modalCustomerAddr">-</span>
          </div>
          <div class="info-row">
            <span class="info-title">방문 시간</span>
            <span class="info-value" id="modalTimeRange">-</span>
          </div>
        </div>

        <!-- 아래 두 버튼은 동시에 보이지 않고 상태에 따라 하나만(또는 둘 다 안) 나타납니다 (result_dashboard.js의 openCustomerModal 참고).
             - 완료(COMPLETED)                                   : "결과보고 보러가기" -> 조회(읽기전용) 화면
             - 완료 아님 + 방문 시작 시각(startTime) 지남(=결과보고 상태) : "결과보고 작성하기" -> 작성 화면
             - 완료 아님 + 아직 방문 시작 전(=진행예정)                : 둘 다 숨김, 기존처럼 정보 확인 + 전화연결만 -->
        <div class="modal-actions">
          <a id="modalWriteResultBtn" class="modal-view-btn" href="#" hidden>결과보고 작성하기</a>
          <a id="modalViewResultBtn" class="modal-view-btn" href="#" hidden>결과보고 보러가기</a>
        </div>
      </div>
    </div>

  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
  <script th:inline="none">
    // 카드(.today-card)를 클릭하면 data-report-url에 적어둔 주소로 이동합니다.
    // "진행예정" 상태 카드는 data-report-url이 비어있게 서버에서 내려주는데, 이 경우엔 이동하는 대신
    // 달력에서 일정을 클릭했을 때와 동일한 "고객 기본정보" 모달을 띄웁니다 (openCustomerModal은
    // result_dashboard.js에서 정의되고, 이 스크립트보다 나중에 로드되지만 실제 호출은 클릭 시점이라 문제없음).
    document.querySelectorAll('.today-card').forEach(function (card) {
      card.addEventListener('click', function () {
        if (card.dataset.reportUrl) {
          location.href = card.dataset.reportUrl;
          return;
        }
        if (typeof openCustomerModal !== 'function') return;
        var startTime = card.dataset.startTime ? new Date(card.dataset.startTime) : null;
        openCustomerModal({
          scheduleNo: card.dataset.scheduleNo,
          customerName: card.dataset.customerName,
          customerTel: card.dataset.customerTel,
          customerAddr: card.dataset.customerAddr,
          timeRange: card.dataset.timeRange,
          status: card.dataset.status
        }, startTime);
      });
    });
  </script>

  <!-- 대시보드 달력에 쓰는 FullCalendar. 관리자 일정 페이지(admin_schedule.html)와 같은 버전을 씁니다 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="/js/pages/result/result_dashboard.js"></script>
</th:block>

</html>
