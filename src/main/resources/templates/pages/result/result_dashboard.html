<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}">

<!--이 곳에 link태그로 css파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/result/result_dashboard.css">
</th:block>

<!--아래 block에 html코드 작성-->
<th:block layout:fragment="content">
  <div class="dash-container">

    <div class="dash-title">
      <h2>AS 기사 대시보드</h2>
      <p>오늘 배정된 AS 일정을 확인하고 처리 결과를 등록해주세요.</p>
    </div>

    <!-- 왼쪽 : 오늘의 일정 / 오른쪽 : 이번 달 달력. 좁은 화면에서는 세로로 쌓입니다(result_dashboard.css) -->
    <div class="dash-main">

      <!--
        todayList는 ResultController의 asResultDashboard()가 넘겨주는
        List<ScheduleTodayDTO> 입니다. th:each로 한 건씩 돌면서 카드 하나씩 그려줍니다.
        비어있으면 아래 today-empty 안내문구가 대신 보입니다.

        카드 전체를 클릭하면 그 일정의 결과보고 화면(/as-result-report?scheduleNo=..)으로 이동합니다.
        (일정이 여러 개일 수 있어서, 목록 밖에 "결과보고" 화면을 따로 하나 두는 건 말이 안 됨 ->
         그래서 일정마다 있는 카드 하나하나가 곧 그 일정의 결과보고로 가는 입구입니다)
        이동할 주소는 data-report-url 속성에 담아두고, 아래 content_js의 스크립트에서 클릭 이벤트로 읽어서 이동시킵니다.
        (Thymeleaf는 onclick 같은 이벤트 속성 안에 문자열을 직접 넣는 걸 막아둬서, data-* 속성 + JS 조합으로 처리합니다)
        단, 카드 안의 "진행예정" 버튼은 클릭해도 카드 이동 없이 그 버튼 기능만 실행되도록
        onclick="event.stopPropagation()"으로 막아뒀습니다.
      -->
      <div class="dash-today-col">
        <div class="today-list" th:if="${not #lists.isEmpty(todayList)}">
          <div class="today-card"
               th:each="schedule : ${todayList}"
               th:data-report-url="@{/as-result-report(scheduleNo=${schedule.scheduleNo})}">
            <!-- 왼쪽 : 시간 / 고객명 / 증상을 한 칸에 세로로 쌓아서 표시 -->
            <div class="today-left">
              <div class="today-time">
                <span th:text="${#temporals.format(schedule.startTime, 'HH:mm')}">09:00</span>
                <span> ~ </span>
                <span th:text="${#temporals.format(schedule.endTime, 'HH:mm')}">12:00</span>
              </div>
              <div class="today-customer" th:text="${schedule.customerName}">고객명</div>
              <div class="today-symptom" th:text="${schedule.symptom}">증상</div>
            </div>

            <!--
              진행상태(requestStatus)에 따라 다르게 보여줌
              - RECEIVED/ASSIGNED(아직 방문 전) : "진행예정" 버튼 -> 누르면 IN_PROGRESS로 변경
              - IN_PROGRESS(진행중)            : 그냥 "진행중" 표시만
              - COMPLETED(완료)                : 그냥 "완료" 표시만
              (결과보고 화면으로 가는 건 이제 카드 전체 클릭이 담당해서, 별도 "결과 등록" 버튼은 없앴습니다)
            -->
            <form th:if="${schedule.requestStatus == 'RECEIVED' or schedule.requestStatus == 'ASSIGNED'}"
                  action="/as-result/start" method="post"
                  onclick="event.stopPropagation()">
              <input type="hidden" name="requestNo" th:value="${schedule.requestNo}">
              <!-- 본인 일정이 맞는지 서버에서 다시 확인할 때 쓰는 값 -->
              <input type="hidden" name="scheduleNo" th:value="${schedule.scheduleNo}">
              <button type="submit" class="status-btn">진행예정</button>
            </form>

            <span th:if="${schedule.requestStatus == 'IN_PROGRESS'}" class="status-badge status-progress">
              진행중
            </span>

            <span th:if="${schedule.requestStatus == 'COMPLETED'}" class="status-badge status-done">
              완료
            </span>
          </div>
        </div>

        <div class="today-empty" th:if="${#lists.isEmpty(todayList)}">
          오늘 배정된 일정이 없습니다.
        </div>

        <!--
          고객 만족도 카드. ResultController의 asResultDashboard()가 SatisfactionService.getStats()로
          만들어서 넘겨주는 satisfactionStats(SatisfactionStatsDTO)를 그대로 그립니다.
          - satisfaction-compare : 이번 달 평균 vs 작년 같은 달 평균 + 증감
          - satisfaction-trend   : 올해 1월~이번 달까지 월별 평균을 막대그래프로 (막대 높이는 5점 만점 기준 서버에서 계산)
        -->
        <div class="dash-satisfaction-card">
          <h3 th:text="${memName} + '기사님 고객만족도 현황'">OOO기사님 고객만족도 현황</h3>

          <div class="satisfaction-compare">
            <div class="satisfaction-stat">
              <span class="satisfaction-stat-label" th:text="${satisfactionStats.thisMonth} + '월 (이번 달)'">이번 달</span>
              <span class="satisfaction-stat-value"
                    th:text="${satisfactionStats.thisMonthAvg != null ? satisfactionStats.thisMonthAvg : '-'}">4.5</span>
            </div>

            <div class="satisfaction-diff"
                 th:if="${satisfactionStats.diff != null}"
                 th:classappend="${satisfactionStats.diff >= 0} ? 'diff-up' : 'diff-down'"
                 th:text="${(satisfactionStats.diff >= 0 ? '▲ +' : '▼ ') + satisfactionStats.diff}">
              ▲ +0.5
            </div>

            <div class="satisfaction-stat">
              <span class="satisfaction-stat-label" th:text="'작년 ' + ${satisfactionStats.thisMonth} + '월'">작년 동월</span>
              <span class="satisfaction-stat-value"
                    th:text="${satisfactionStats.lastYearAvg != null ? satisfactionStats.lastYearAvg : '-'}">4.1</span>
            </div>
          </div>

          <div class="satisfaction-trend">
            <div class="trend-bar-wrap" th:each="m : ${satisfactionStats.monthlyTrend}">
              <span class="trend-bar-score" th:text="${m.avgScore > 0 ? m.avgScore : ''}">4.5</span>
              <div class="trend-bar" th:style="'height:' + (${m.avgScore} * 16) + 'px'"></div>
              <span class="trend-bar-label" th:text="${m.month} + '월'">1월</span>
            </div>
          </div>
        </div>
      </div>

      <!--
        이번 달 일정 달력. 날짜 칸을 직접 서버에서 그리는 대신 FullCalendar(관리자 일정 페이지와 동일한 CDN 버전)를
        그대로 붙여서 씁니다. 달력에 표시할 데이터는 여기서 미리 내려주지 않고, result_dashboard.js가
        /as-result-calendar?year=&month= 를 호출해서 지금 보여주는 달의 일정(고객명/시간/주소/연락처)을 그때그때 받아옵니다.
        (달을 넘겨도 그 달의 데이터가 항상 맞게 나오도록 하기 위함)
        일정이 찍힌 칸의 짧은 정보 블록을 클릭하면 result_dashboard.js의 eventClick에서
        /as-result-report?scheduleNo=.. 로 바로 이동시켜줍니다.
      -->
      <div class="dash-calendar-card">
        <h3>이번 달 일정</h3>
        <div id="dashCalendar"></div>
        <div class="dash-calendar-legend">
          <span><i class="dash-legend-dot dash-legend-past"></i>지난 일정</span>
          <span><i class="dash-legend-dot dash-legend-today"></i>오늘 일정</span>
          <span><i class="dash-legend-dot dash-legend-future"></i>예정된 일정</span>
        </div>
      </div>

    </div>

  </div>
</th:block>

<!--이 곳에 script태그로 js파일을 연결하는 코드 작성-->
<th:block layout:fragment="content_js">
  <script th:inline="none">
    // 카드(.today-card)를 클릭하면 data-report-url에 적어둔 주소로 이동합니다.
    document.querySelectorAll('.today-card').forEach(function (card) {
      card.addEventListener('click', function () {
        location.href = card.dataset.reportUrl;
      });
    });
  </script>

  <!-- 대시보드 달력에 쓰는 FullCalendar. 관리자 일정 페이지(admin_schedule.html)와 같은 버전을 씁니다 -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="/js/pages/result/result_dashboard.js"></script>
</th:block>

</html>
