<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout}">

<th:block layout:fragment="content_css">
  <link rel="stylesheet" href="/css/pages/schedule/admin_schedule.css">
</th:block>

<th:block layout:fragment="content">
  <div class="schedule-container">
    <div>
      <h3>일정 관리</h3>
    </div>
      <div class="schedule-main">
        <div class="cal-card">
          <div class="cal-toolbar">
            <div class="tb-left">
              <button id="prevBtn" aria-label="이전 기간">‹</button>
              <button id="nextBtn" aria-label="다음 기간">›</button>
              <span class="cal-title" id="calTitle"></span>
            </div>
            <div class="tb-right">
              <div class="view-switch" id="viewSwitch">
                <button data-view="timeGridDay">일</button>
                <button data-view="timeGridWeek">주</button>
                <button data-view="dayGridMonth" class="active">월</button>
              </div>
              <select id="techFilter" aria-label="담당 기사 필터">
                <option value="all">전체 기사</option>
                <th:block th:each="engineer:${engineerList}">
                  <option th:value="${engineer.engineerNo}">
                    [[${engineer.engineerName}]]</option>
                </th:block>
              </select>
            </div>
          </div>

          <!-- 일정 상태 색상 범례. STATUS_COLORS(admin_schedule.js)와 색을 맞춰서, 달력에 찍힌
               이벤트 색깔만 보고도 바로 어떤 상태인지 알 수 있게 합니다. 아이콘 대신 색상 점 + 텍스트만 사용. -->
          <div class="cal-legend">
            <span class="legend-item"><i class="legend-dot legend-received"></i>접수완료</span>
            <span class="legend-item"><i class="legend-dot legend-assigned"></i>기사배정</span>
            <span class="legend-item"><i class="legend-dot legend-progress"></i>작업진행</span>
            <span class="legend-item"><i class="legend-dot legend-complete"></i>작업완료</span>
          </div>

          <div id="calendar"></div>
        </div>
        <div class="assign-card">
          <h4>AS 일정 배정</h4>
          <form action="/assign-schedule" method="post" id="schdeule-reg-form">
            <div>
              <p>AS 접수 선택</p>
              <select name="requestNo" id="">
                <option value="">[선택하세요]</option>
                <th:block th:each="receive:${receiveList}">
                  <option th:value="${receive.requestNo}">
                    [[${receive.customerName}]] - [[${receive.productType}]]</option>
                </th:block>
              </select>
            </div>
            <div>
              <p>배정할 기사</p>
              <select name="engineerNo" id="">
                <option value="">[선택하세요]</option>
                <th:block th:each="engineer:${engineerList}">
                  <option th:value="${engineer.engineerNo}">
                    [[${engineer.engineerName}]]</option>
                </th:block>
              </select>
            </div>
            <div data-picker-field>
              <p>배정 날짜</p>
              <input type="date" id="fixDateInput" name="fixDate">
            </div>
            <div>
              <p>방문 시간</p>
              <div class="time-range">
                <label class="time-field" for="startTimeInput" data-picker-field>
                  <span class="time-field-caption">시작 시간</span>
                  <input type="time" id="startTimeInput" value="09:00" aria-label="방문 시작 시간">
                </label>
                <span class="time-range-arrow" aria-hidden="true">→</span>
                <label class="time-field" for="endTimeInput" data-picker-field>
                  <span class="time-field-caption">종료 시간</span>
                  <input type="time" id="endTimeInput" value="10:00" aria-label="방문 종료 시간">
                </label>
              </div>
              <p class="time-help">각 입력 상자를 눌러 방문 예정 시간을 조정하세요.</p>
              <!-- fixDate + 시간을 합쳐 LocalDateTime 형식("yyyy-MM-ddTHH:mm")으로 실제 전송하는 hidden input -->
              <input type="hidden" name="startTime" id="startTimeHidden">
              <input type="hidden" name="endTime" id="endTimeHidden">
            </div>
            <div>
              <p class="validate" id="error-msg"></p>
              <button type="button">일정 배정하기</button>
            </div>
          </form>
        </div>
      </div>
  </div>
</th:block>

<th:block layout:fragment="content_js">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const requestList = /*[[${requestList}]]*/ [];
    const scheduleList = /*[[${scheduleList}]]*/ [];
    /*]]>*/
  </script>

  <script src="/js/pages/schedule/admin_schedule.js"></script>
</th:block>
</html>
