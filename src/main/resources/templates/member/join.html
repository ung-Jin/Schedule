<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 냉·난방 AS</title>
  <a href="/css/member/join.css"></a>
</head>
<body>

  <div class="join-container">

    <h1 class="join-logo"><a th:href="@{/}">냉,난방 AS</a></h1>

    <form th:action="@{/member/join}" method="post" class="join-form">

      <h2>회원가입</h2>

      <!-- 비밀번호 불일치 / 아이디 중복 시 여기에 에러 메시지가 뜹니다. -->
      <p class="error-msg" th:if="${joinError}" th:text="${joinError}">에러 메시지</p>

      <div class="form-group">
        <label for="memId">아이디</label>
        <input type="text" id="memId" name="memId" th:value="${memId}" required>
      </div>

      <div class="form-group">
        <label for="memPw">비밀번호</label>
        <input type="password" id="memPw" name="memPw" required>
      </div>

      <div class="form-group">
        <label for="memPwConfirm">비밀번호 확인</label>
        <input type="password" id="memPwConfirm" name="memPwConfirm" required>
      </div>

      <div class="form-group">
        <label for="memName">이름</label>
        <input type="text" id="memName" name="memName" th:value="${memName}" required>
      </div>

      <button type="submit" class="btn btn-primary join-submit">가입하기</button>

      <p class="login-link">이미 계정이 있으신가요? <a th:href="@{/member/login}">로그인</a></p>

    </form>

  </div>

</body>
</html>
