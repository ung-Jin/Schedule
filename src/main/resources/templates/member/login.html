<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>

  <link rel="stylesheet" href="/login.css">
  <link rel="stylesheet" th:href="@{/common/layout.css}">
</head>
<body class="account-page">

  <div class="login-container">
    <section class="login-intro" aria-label="서비스 소개">
      <span class="eyebrow">HVAC SERVICE CONTROL</span>
      <h2>모든 현장을 연결하는<br><em>하나의 관제실.</em></h2>
      <p>냉·난방 A/S 접수부터 기사 배정, 방문과 완료까지.<br>필요한 업무를 한곳에서 확인하세요.</p>
      <div class="login-flow"><span>01 접수</span><span>02 배정</span><span>03 방문</span><span>04 완료</span></div>
    </section>
    <div class="login-box">

      <h1 class="account-brand"><a th:href="@{/}" aria-label="AIR LINK 홈"><img th:src="@{/common/airlink-horizontal-light.png}" alt="AIR LINK · 냉·난방 AS기사 스케줄 관리 시스템" class="airlink-logo"></a></h1>

      <!-- 로그인 실패 시에만 보이는 에러 메시지 -->
      <p class="error-msg" th:if="${loginError}" th:text="${loginError}"></p>


      <!-- 서버(MemberController)가 조회한 회원의 role 값을 보고 알아서 이동시켜줌 -->
      <form th:action="@{/member/login}" method="post" id="loginForm">

        <div class="input-group">
          <label for="memId">아이디</label>
          <input type="text" id="memId" name="memId" autocomplete="username" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="input-group">
          <label for="memPw">비밀번호</label>
          <div class="pw-wrap">
            <input type="password" id="memPw" name="memPw" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
            <button type="button" id="pwToggleBtn" class="pw-toggle" aria-label="비밀번호 표시 전환">👁</button>
          </div>
        </div>

        <div class="login-options">
          <label><input type="checkbox" id="saveId"> 아이디 저장</label>
          <a href="/member/join">회원가입</a>
        </div>

        <button type="submit" class="btn-login">로그인</button><br>

      </form>

    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
