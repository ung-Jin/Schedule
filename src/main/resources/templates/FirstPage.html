<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>냉·난방 AS</title>

  <link rel="stylesheet" href="FirstPage.css">
</head>
<body>

  <div class="container">

    <!-- 상단 메뉴 -->
    <header class="first-top">
      <h1><img th:src="@{/common/logo.jpg}" alt="냉·난방 AS 로고" class="brand-logo"></h1>

      <nav>
        <ul>
          <li><a th:href="@{/service-intro}">서비스소개</a></li>
          <li><a th:href="@{/features}">주요기능</a></li>
          <li>
            <a th:href="@{/member/login}"
               th:text="${session.loginMember == null} ? '로그인' : (${session.loginMember.memName} + '님')">로그인</a>
          </li>
          <li th:if="${session.loginMember != null}"><a th:href="@{/member/logout}">로그아웃</a></li>
        </ul>
      </nav>
    </header>

    <!-- 메인 소개 영역 -->
    <section class="hero">
      <h2>냉·난방 AS기사<br>스케줄 관리 시스템</h2>
      <p>체계적인 일정 관리로<br>더 빠르고, 더 나은 서비스를 제공합니다.</p>

      <div class="hero-buttons">
        <a th:href="@{/member/login}" class="btn btn-primary"
           th:text="${session.loginMember == null} ? '로그인 →' : '내 화면으로 이동 →'">로그인 &rarr;</a>
        <a th:href="@{/service-intro}" class="btn btn-outline">서비스 소개</a>
      </div>
    </section>

    <!-- 주요 기능은 이제 별도 페이지(/features)에서 보여줍니다.
         홈 화면에는 미리보기 카드 3개만 살짝 보여주고,
         클릭하면 /features 페이지로 이동합니다. -->
    <section class="features-preview">
      <h2>주요 기능</h2>

      <div class="feature-cards">
        <div class="feature-card">
          <h3>일정 관리</h3>
          <p>효율적인 AS 일정 관리로<br>신속한 대응이 가능합니다.</p>
        </div>

        <div class="feature-card">
          <h3>기사 관리</h3>
          <p>기사 정보와 근무 일정을<br>체계적으로 관리합니다.</p>
        </div>

        <div class="feature-card">
          <h3>AS 결과 보고</h3>
          <p>작업 완료 후 결과를<br>등록하고 확인할 수 있습니다.</p>
        </div>
      </div>

      <a th:href="@{/features}" class="btn btn-outline more-link">더 알아보기 &rarr;</a>
    </section>

  </div>

</body>
</html>
